<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7FF64"/>
      <stop offset="1" stop-color="#74C7A1"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#10120F"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <circle cx="930" cy="150" r="204" fill="url(#orb)" opacity=".12"/>
  <circle cx="930" cy="150" r="138" fill="none" stroke="#D7FF64" stroke-opacity=".34" stroke-width="1.5"/>
  <circle cx="930" cy="150" r="93" fill="none" stroke="#D7FF64" stroke-opacity=".24" stroke-width="1.5"/>
  <circle cx="930" cy="150" r="11" fill="#D7FF64"/>
  <path d="M789 150h282M930 9v282M830 50l200 200M1030 50 830 250" stroke="#D7FF64" stroke-opacity=".2" stroke-width="1.5"/>

  <text x="80" y="91" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="4">AI BRIEF</text>
  <text x="80" y="136" fill="#A6AA9E" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">THE DAILY SIGNAL</text>
  <rect x="80" y="190" width="150" height="38" rx="19" fill="#D7FF64"/>
  <text x="105" y="216" fill="#10120F" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DEVELOPMENT</text>

  <text x="80" y="356" fill="#F4F5EF" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-2">
    <tspan x="80" dy="0">YOUR HEADLINE</tspan>
    <tspan x="80" dy="82">GOES RIGHT</tspan>
    <tspan x="80" dy="82">HERE.</tspan>
  </text>
  <rect x="80" y="624" width="84" height="6" rx="3" fill="#D7FF64"/>
  <text x="80" y="708" fill="#B7B9B0" font-family="Arial, Helvetica, sans-serif" font-size="29">
    <tspan x="80" dy="0">One clear sentence explaining what</tspan>
    <tspan x="80" dy="43">changed and why it matters.</tspan>
  </text>

  <g transform="translate(80 898)">
    <rect width="920" height="174" rx="20" fill="#1B1E19" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="30" y="48" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">WHY IT MATTERS</text>
    <text x="30" y="98" fill="#F4F5EF" font-family="Arial, Helvetica, sans-serif" font-size="24">
      <tspan x="30" dy="0">A short, useful takeaway for people building,</tspan>
      <tspan x="30" dy="36">using, or following AI.</tspan>
    </text>
  </g>

  <line x1="80" y1="1208" x2="1000" y2="1208" stroke="#FFFFFF" stroke-opacity=".16"/>
  <text x="80" y="1259" fill="#A6AA9E" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">SOURCE  /  ORGANIZATION OR PUBLICATION</text>
  <text x="80" y="1305" fill="#72766D" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">AI BRIEF  ·  DD MMM YYYY</text>
  <text x="1000" y="1305" text-anchor="end" fill="#D7FF64" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">01 / 01</text>
</svg>
