name: AI Brief daily Instagram publishing

on:
  schedule:
    - cron: "35 1 * * *" # 07:05 IST: prepare the image and deploy it to Pages
    - cron: "35 2 * * *" # 08:05 IST: publish today's image
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare image or publish today's ready package"
        type: choice
        options:
          - prepare
          - publish
        required: true
        default: prepare

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: instagram-daily-${{ github.event.schedule || inputs.mode || 'scheduled' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.schedule == '35 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free image libraries
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build today's image and source package
        run: python pipeline.py prepare
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit the public image and source package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Prepare daily AI Brief image"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy public image hosting site
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    if: github.event.schedule == '35 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free token-renewal library
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Publish to Instagram
        run: python pipeline.py publish
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_GRAPH_VERSION: "v25.0"

      - name: Commit the published-state record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Record daily AI Brief publication"
          git push
